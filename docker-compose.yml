version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: appchat-db
    restart: always
    environment:
      POSTGRES_USER: appchat
      POSTGRES_PASSWORD: appchat
      POSTGRES_DB: appchat
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    container_name: appchat-redis
    restart: always
    ports:
      - '6379:6379'